<!DOCTYPE html>
<html>
  <head>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://unpkg.com/aframe-environment-component@1.3.3/dist/aframe-environment-component.min.js"></script>
  </head>
  <body>
    <script>
      AFRAME.registerComponent('click-reactor', {
        init: function () {
          this.el.addEventListener('click', (evt) => {
            const randomColor = '#' + Math.floor(Math.random()*16777215).toString(16);
            this.el.setAttribute('material', 'color', randomColor);
            this.el.setAttribute('animation', 'property: scale; to: 1.5 1.5 1.5; dir: alternate; dur: 200; loop: 1');
          });
        }
      });
    </script>

    <a-scene>
      <a-assets>
        <a-asset-item id="helmet-model" src="https://cdn.aframe.io/examples-showcase/link-traversal/models/scifi-helmet/scifi-helmet.gltf"></a-asset-item>
      </a-assets>

      <a-entity environment="preset: starry; groundColor: #445; grid: 1x1"></a-entity>

      <a-entity 
        gltf-model="#helmet-model" 
        position="0 1.5 -3" 
        scale="0.5 0.5 0.5"
        animation="property: rotation; to: 0 360 0; loop: true; dur: 10000; easing: linear"
        click-reactor>
      </a-entity>

      <a-sphere position="-2 1.5 -4" radius="0.5" color="#EF2D5E" 
                click-reactor
                animation="property: position; to: -2 2 -4; dir: alternate; dur: 2000; loop: true">
      </a-sphere>

      <a-sphere position="2 1.5 -4" radius="0.5" color="#FFC65D" 
                click-reactor
                animation="property: position; to: 2 1 -4; dir: alternate; dur: 2000; loop: true">
      </a-sphere>

      <a-entity id="rig" position="0 0 0">
        <a-entity camera 
                  look-controls 
                  wasd-controls="acceleration: 100" 
                  position="0 1.6 0">
          
          <a-cursor
            color="yellow"
            fuse="false"
            raycaster="objects: [click-reactor]"> 
          </a-cursor>
        </a-entity>
      </a-entity>
      
    </a-scene>
  </body>
</html>
