<!DOCTYPE html>
<html>
  <head>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://unpkg.com/aframe-environment-component@1.3.3/dist/aframe-environment-component.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-physics-system@v4.2.2/dist/aframe-physics-system.min.js"></script>
  </head>
  <body>
    <script>
      // --- SHOOTER LOGIC ---
      AFRAME.registerComponent('shooter', {
        init: function () {
          window.addEventListener('click', () => {
            // 1. Create a new ball
            let ball = document.createElement('a-sphere');
            ball.setAttribute('position', this.el.object3D.position);
            ball.setAttribute('radius', '0.2');
            ball.setAttribute('color', '#FFFF00');
            ball.setAttribute('dynamic-body', 'shape: sphere; mass: 5'); // Make it heavy
            
            // 2. Calculate shooting direction (where you are looking)
            let direction = new THREE.Vector3();
            this.el.object3D.getWorldDirection(direction);
            direction.multiplyScalar(-20); // Speed of the ball (negative because A-Frame camera looks down -Z)

            // 3. Apply velocity
            ball.setAttribute('velocity', `${direction.x} ${direction.y} ${direction.z}`);

            // 4. Add to scene
            this.el.sceneEl.appendChild(ball);

            // 5. Clean up ball after 5 seconds so browser doesn't crash
            setTimeout(() => {
              ball.parentNode.removeChild(ball);
            }, 5000);
          });
        }
      });
    </script>

    <a-scene physics="gravity: -9.8; debug: false">
      
      <a-entity environment="preset: volcano; ground: flat"></a-entity>

      <a-plane static-body rotation="-90 0 0" scale="100 100 1" visible="false"></a-plane>

      <a-box position="-1 0.5 -5" color="red" dynamic-body></a-box>
      <a-box position="0 0.5 -5" color="orange" dynamic-body></a-box>
      <a-box position="1 0.5 -5" color="yellow" dynamic-body></a-box>
      
      <a-box position="-0.5 1.5 -5" color="green" dynamic-body></a-box>
      <a-box position="0.5 1.5 -5" color="blue" dynamic-body></a-box>
      
      <a-box position="0 2.5 -5" color="purple" dynamic-body></a-box>

      <a-cylinder position="4 1 -6" height="2" radius="0.5" color="#333" dynamic-body></a-cylinder>

      <a-entity id="rig" movement-controls position="0 0 0">
        <a-entity camera 
                  look-controls 
                  wasd-controls="acceleration: 150" 
                  position="0 1.6 0"
                  shooter> <a-cursor color="red" scale="0.5 0.5 0.5"></a-cursor>
            
            <a-box position="0.2 -0.3 -0.5" scale="0.1 0.1 0.5" color="gray"></a-box>
        </a-entity>
      </a-entity>
      
    </a-scene>
  </body>
</html>
